apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-stocker-api
  namespace: app
  labels:
    app: tw-stocker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tw-stocker-api
  template:
    metadata:
      labels:
        app: tw-stocker-api
    spec:
      containers:
        - name: api
          image: docker.io/library/tw-stocker-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: tw-stocker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tw-stocker-secrets
                  key: DB_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tw-stocker-secrets
                  key: OPENAI_API_KEY
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: tw-stocker-secrets
                  key: GA_MEASUREMENT_ID
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tw-stocker-api
  namespace: app
  labels:
    app: tw-stocker-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: tw-stocker-api
