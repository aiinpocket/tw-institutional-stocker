apiVersion: batch/v1
kind: CronJob
metadata:
  name: tw-stocker-etl-backfill
  namespace: app
  labels:
    app: tw-stocker-etl
    etl-type: backfill
spec:
  schedule: "30 22 * * 1-5"
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: tw-stocker-etl
            etl-type: backfill
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: docker.io/library/tw-stocker-etl:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.etl.backfill_prices", "--mode", "incremental", "--days", "3"]
              envFrom:
                - configMapRef:
                    name: tw-stocker-config
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tw-stocker-secrets
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
