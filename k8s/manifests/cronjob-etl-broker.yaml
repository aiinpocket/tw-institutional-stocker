apiVersion: batch/v1
kind: CronJob
metadata:
  name: tw-stocker-etl-broker
  namespace: tw-stocker
  labels:
    app: tw-stocker-etl
    etl-type: broker
spec:
  schedule: "0 22 * * 1-5"
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: tw-stocker-etl
            etl-type: broker
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: docker.io/library/tw-stocker-etl:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.etl.run_broker"]
              envFrom:
                - configMapRef:
                    name: tw-stocker-config
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tw-stocker-secrets
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
