apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tw-stocker-postgres-data
  namespace: tw-stocker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-stocker-postgres
  namespace: tw-stocker
  labels:
    app: tw-stocker-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tw-stocker-postgres
  template:
    metadata:
      labels:
        app: tw-stocker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "tw_stocker"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tw-stocker-secrets
                  key: DB_PASSWORD
            - name: TZ
              value: "Asia/Taipei"
            - name: PGTZ
              value: "Asia/Taipei"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - tw_stocker
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - tw_stocker
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: tw-stocker-postgres-data
        - name: init-sql
          configMap:
            name: tw-stocker-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: tw-stocker-postgres
  namespace: tw-stocker
  labels:
    app: tw-stocker-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: tw-stocker-postgres
