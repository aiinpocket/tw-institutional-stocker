    <script>
        const API_BASE = '/api/v1/ai';
        let currentStrategy = 'balanced';

        function showMarketTab() {
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="card-title"><span class="icon">📊</span> 今日市場 AI 摘要</div>
                    <div id="market-content"><div class="loading">AI 分析中，請稍候</div></div>
                </div>
            `;
            loadMarketSummary();
        }

        async function loadMarketSummary() {
            try {
                const resp = await fetch(`${API_BASE}/market-summary`);
                const data = await resp.json();

                const html = `
                    <div class="ai-content">${data.summary}</div>
                    <div class="disclaimer">${data.disclaimer}</div>
                `;
                document.getElementById('market-content').innerHTML = html;
            } catch (e) {
                document.getElementById('market-content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗，請稍後再試</div>';
            }
        }

        function showRecommendTab() {
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="card-title"><span class="icon">💡</span> AI 智能選股</div>
                    <div class="strategy-buttons">
                        <div class="strategy-btn ${currentStrategy === 'aggressive' ? 'active' : ''}" onclick="selectStrategy('aggressive')">
                            <span class="icon">🚀</span>
                            <div class="name">積極型</div>
                            <div class="desc">追求高報酬，可承受較高風險</div>
                        </div>
                        <div class="strategy-btn ${currentStrategy === 'balanced' ? 'active' : ''}" onclick="selectStrategy('balanced')">
                            <span class="icon">⚖️</span>
                            <div class="name">穩健型</div>
                            <div class="desc">風險與報酬平衡，法人認同</div>
                        </div>
                        <div class="strategy-btn ${currentStrategy === 'conservative' ? 'active' : ''}" onclick="selectStrategy('conservative')">
                            <span class="icon">🛡️</span>
                            <div class="name">保守型</div>
                            <div class="desc">以保本為主，大型權值股</div>
                        </div>
                    </div>
                    <div id="recommend-content"><div class="loading">AI 分析中，請稍候</div></div>
                </div>
            `;
            loadRecommendations();
        }

        function selectStrategy(strategy) {
            currentStrategy = strategy;
            document.querySelectorAll('.strategy-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('recommend-content').innerHTML = '<div class="loading">AI 分析中，請稍候</div>';
            loadRecommendations();
        }

        async function loadRecommendations() {
            try {
                const resp = await fetch(`${API_BASE}/recommendations?strategy=${currentStrategy}&limit=9`);
                const data = await resp.json();

                const html = `
                    <div class="market-view"><strong>市場觀點：</strong>${data.market_view}</div>
                    <div class="recommendation-grid">
                        ${data.recommendations.map(r => `
                            <div class="rec-card" onclick="window.location='/stock/${r.code}'">
                                <div class="stock-info">
                                    <div>
                                        <span class="stock-code">${r.code}</span>
                                        <span class="stock-name">${r.name}</span>
                                    </div>
                                </div>
                                <div class="reason">📌 ${r.reason}</div>
                                <div class="focus">👁️ ${r.focus}</div>
                                <div class="risk">⚠️ ${r.risk}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="disclaimer">${data.disclaimer}</div>
                `;
                document.getElementById('recommend-content').innerHTML = html;
            } catch (e) {
                document.getElementById('recommend-content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗，請稍後再試</div>';
            }
        }

        function showStockTab() {
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="card-title"><span class="icon">🔍</span> AI 個股分析</div>
                    <div class="search-box">
                        <div class="search-box-wrapper">
                            <input type="text" id="stock-code" placeholder="輸入股票代號或公司名稱 (例如: 2330 或 台積電)" autocomplete="off">
                            <div id="autocomplete-dropdown" class="autocomplete-dropdown"></div>
                        </div>
                        <button id="analyze-btn" onclick="analyzeStock()">開始分析</button>
                    </div>
                    <div id="stock-content"></div>
                </div>
            `;

            const input = document.getElementById('stock-code');
            const dropdown = document.getElementById('autocomplete-dropdown');
            let debounceTimer;

            input.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                const query = e.target.value.trim();
                if (query.length < 2) {
                    dropdown.classList.remove('show');
                    return;
                }
                debounceTimer = setTimeout(() => searchStocks(query), 300);
            });

            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    dropdown.classList.remove('show');
                    analyzeStock();
                }
            });

            input.addEventListener('blur', () => {
                setTimeout(() => dropdown.classList.remove('show'), 200);
            });
        }

        async function searchStocks(query) {
            const dropdown = document.getElementById('autocomplete-dropdown');
            try {
                const resp = await fetch(`/api/v1/stocks?search=${encodeURIComponent(query)}&limit=10`);
                const data = await resp.json();
                if (data.items && data.items.length > 0) {
                    dropdown.innerHTML = data.items.map(s => `
                        <div class="autocomplete-item" onclick="selectStock('${s.code}', '${s.name}')">
                            <span class="code">${s.code}</span>
                            <span class="name">${s.name}</span>
                        </div>
                    `).join('');
                    dropdown.classList.add('show');
                } else {
                    dropdown.classList.remove('show');
                }
            } catch (e) {
                dropdown.classList.remove('show');
            }
        }

        function selectStock(code, name) {
            document.getElementById('stock-code').value = code;
            document.getElementById('autocomplete-dropdown').classList.remove('show');
        }

        async function analyzeStock() {
            let input = document.getElementById('stock-code').value.trim();
            if (!input) {
                alert('請輸入股票代號或公司名稱');
                return;
            }

            let code = input;

            // 如果不是純數字代號，嘗試搜尋公司名稱
            if (!/^[0-9]{4,6}$/.test(input)) {
                try {
                    const searchResp = await fetch(`/api/v1/stocks?search=${encodeURIComponent(input)}&limit=1`);
                    const searchData = await searchResp.json();
                    if (searchData.items && searchData.items.length > 0) {
                        code = searchData.items[0].code;
                    } else {
                        alert('找不到符合的股票，請確認名稱或代號');
                        return;
                    }
                } catch (e) {
                    alert('搜尋失敗，請稍後再試');
                    return;
                }
            }

            document.getElementById('stock-content').innerHTML = '<div class="loading">AI 分析中，這可能需要 10-20 秒</div>';
            document.getElementById('analyze-btn').disabled = true;

            try {
                // Fetch AI analysis and price data in parallel
                const [analysisResp, priceResp] = await Promise.all([
                    fetch(`${API_BASE}/stock/${code}`),
                    fetch(`/api/v1/stocks/${code}/prices?limit=60`)
                ]);

                if (!analysisResp.ok) throw new Error('股票不存在');
                const data = await analysisResp.json();
                const priceData = priceResp.ok ? await priceResp.json() : { data: [] };

                const html = `
                    <div style="margin-bottom:15px">
                        <span style="font-size:1.5rem;font-weight:700;color:#00d4ff">${data.stock_code}</span>
                        <span style="font-size:1.2rem;color:#ccc">${data.stock_name}</span>
                        <span style="color:#888;margin-left:10px">${data.industry || ''}</span>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px">
                        <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;text-align:center">
                            <div style="color:#888;font-size:0.8rem">外資持股</div>
                            <div style="font-size:1.2rem;font-weight:600">${data.data_summary.foreign_ratio ? data.data_summary.foreign_ratio.toFixed(1) + '%' : '-'}</div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;text-align:center">
                            <div style="color:#888;font-size:0.8rem">外資5日</div>
                            <div style="font-size:1.2rem;font-weight:600;color:${data.data_summary.foreign_5d >= 0 ? '#ef5350' : '#26a69a'}">${data.data_summary.foreign_5d}</div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;text-align:center">
                            <div style="color:#888;font-size:0.8rem">投信5日</div>
                            <div style="font-size:1.2rem;font-weight:600;color:${data.data_summary.trust_5d >= 0 ? '#ef5350' : '#26a69a'}">${data.data_summary.trust_5d}</div>
                        </div>
                    </div>
                    <div class="stock-analysis-layout">
                        <div class="stock-analysis-text">
                            <div class="ai-content">${data.analysis}</div>
                            <div class="disclaimer">${data.disclaimer}</div>
                        </div>
                        <div class="stock-analysis-chart" id="ai-stock-chart"></div>
                    </div>
                `;
                document.getElementById('stock-content').innerHTML = html;

                // Render K-line chart if price data available
                if (priceData.data && priceData.data.length > 0) {
                    renderAIStockChart(priceData.data);
                }
            } catch (e) {
                document.getElementById('stock-content').innerHTML = '<div class="loading" style="color:#e74c3c">分析失敗：' + e.message + '</div>';
            }
            document.getElementById('analyze-btn').disabled = false;
        }

        function renderAIStockChart(prices) {
            const container = document.getElementById('ai-stock-chart');
            if (!container || !prices.length) return;

            const chart = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: 'transparent' },
                    textColor: '#888',
                },
                grid: {
                    vertLines: { color: 'rgba(255, 255, 255, 0.05)' },
                    horzLines: { color: 'rgba(255, 255, 255, 0.05)' },
                },
                rightPriceScale: { borderColor: 'rgba(255, 255, 255, 0.1)' },
                timeScale: { borderColor: 'rgba(255, 255, 255, 0.1)', timeVisible: true },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#ef5350',
                downColor: '#26a69a',
                borderUpColor: '#ef5350',
                borderDownColor: '#26a69a',
                wickUpColor: '#ef5350',
                wickDownColor: '#26a69a',
            });

            const candleData = prices.map(p => ({
                time: p.trade_date,
                open: p.open_price,
                high: p.high_price,
                low: p.low_price,
                close: p.close_price,
            })).filter(d => d.open && d.high && d.low && d.close);

            candlestickSeries.setData(candleData);
            chart.timeScale().fitContent();

            // Resize handler
            const resizeObserver = new ResizeObserver(() => {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            });
            resizeObserver.observe(container);
        }

        function showCompareTab() {
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="card-title"><span class="icon">⚖️</span> AI 股票比較</div>
                    <p style="color:#888;margin-bottom:15px">輸入 2-5 檔股票代碼進行比較分析</p>
                    <div class="compare-input">
                        <input type="text" class="compare-code" placeholder="2330" maxlength="6">
                        <input type="text" class="compare-code" placeholder="2317" maxlength="6">
                        <input type="text" class="compare-code" placeholder="2454" maxlength="6">
                        <input type="text" class="compare-code" placeholder="" maxlength="6">
                        <input type="text" class="compare-code" placeholder="" maxlength="6">
                        <button onclick="compareStocks()" style="padding:12px 25px;border:none;border-radius:10px;background:linear-gradient(90deg,#00d4ff,#7b2cbf);color:#fff;cursor:pointer">比較分析</button>
                    </div>
                    <div id="compare-content"></div>
                </div>
            `;
        }

        async function compareStocks() {
            const codes = Array.from(document.querySelectorAll('.compare-code'))
                .map(input => input.value.trim())
                .filter(code => /^[0-9]{4,6}$/.test(code));

            if (codes.length < 2) {
                alert('請輸入至少 2 檔股票代號');
                return;
            }

            document.getElementById('compare-content').innerHTML = '<div class="loading">AI 比較分析中，請稍候</div>';

            try {
                const resp = await fetch(`${API_BASE}/compare?codes=${codes.join(',')}`);
                const data = await resp.json();

                const html = `
                    <table style="width:100%;margin-bottom:20px">
                        <thead>
                            <tr>
                                <th style="padding:10px;text-align:left;color:#888">股票</th>
                                <th style="padding:10px;text-align:right;color:#888">股價</th>
                                <th style="padding:10px;text-align:right;color:#888">外資5日</th>
                                <th style="padding:10px;text-align:right;color:#888">外資20日</th>
                                <th style="padding:10px;text-align:right;color:#888">投信5日</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.stocks.map(s => `
                                <tr style="border-bottom:1px solid rgba(255,255,255,0.1)">
                                    <td style="padding:12px 10px"><strong style="color:#00d4ff">${s.code}</strong> ${s.name}</td>
                                    <td style="padding:12px 10px;text-align:right">${s.price ? s.price.toFixed(1) : '-'}</td>
                                    <td style="padding:12px 10px;text-align:right;color:${s.foreign_5d >= 0 ? '#ef5350' : '#26a69a'}">${s.foreign_5d}</td>
                                    <td style="padding:12px 10px;text-align:right;color:${s.foreign_20d >= 0 ? '#ef5350' : '#26a69a'}">${s.foreign_20d}</td>
                                    <td style="padding:12px 10px;text-align:right;color:${s.trust_5d >= 0 ? '#ef5350' : '#26a69a'}">${s.trust_5d}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="ai-content">${data.analysis}</div>
                    <div class="disclaimer">${data.disclaimer}</div>
                `;
                document.getElementById('compare-content').innerHTML = html;
            } catch (e) {
                document.getElementById('compare-content').innerHTML = '<div class="loading" style="color:#e74c3c">比較分析失敗</div>';
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                if (tabId === 'market') showMarketTab();
                else if (tabId === 'recommend') showRecommendTab();
                else if (tabId === 'stock') showStockTab();
                else if (tabId === 'compare') showCompareTab();
            });
        });

        // Load data date
        async function loadDataDate() {
            try {
                const resp = await fetch('/api/v1/system/daily-summary');
                const data = await resp.json();
                if (data.date) {
                    document.getElementById('dataDate').textContent = `資料基準日：${data.date}`;
                }
            } catch (e) {
                document.getElementById('dataDate').textContent = '資料基準日：載入失敗';
            }
        }

        // 檢查是否在資料更新時段（台北時間 21:00-23:00）
        function checkUpdatePeriod() {
            const banner = document.getElementById('update-period-banner');
            const now = new Date();
            const taipeiHour = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' })).getHours();
            if (taipeiHour >= 21 && taipeiHour < 23) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        checkUpdatePeriod();
        showMarketTab();
        loadDataDate();
    </script>
</body>
</html>
