    <script>
        const API_BASE = '/api/v1/strategy';
        let cachedData = null;
        let excludeEtf = false;

        const tierLabels = {
            'high': '股價 ≥ 500元',
            'mid': '200-500元',
            'low': '股價 < 200元'
        };

        const tierClasses = {
            'high': 'tier-high',
            'mid': 'tier-mid',
            'low': 'tier-low'
        };

        async function fetchData() {
            try {
                const params = new URLSearchParams();
                if (excludeEtf) {
                    params.append('exclude_etf', 'true');
                }
                const url = `${API_BASE}/summary${params.toString() ? '?' + params.toString() : ''}`;
                const response = await fetch(url);
                cachedData = await response.json();
                return cachedData;
            } catch (error) {
                console.error('Failed to fetch data:', error);
                return null;
            }
        }

        function getWinRateClass(rate) {
            if (rate >= 70) return 'high';
            if (rate >= 50) return 'medium';
            return 'low';
        }

        function renderWinRateTable(data, tier) {
            if (!data || data.length === 0) {
                return '<tr><td colspan="5" style="text-align:center;color:#666;">暫無足夠資料</td></tr>';
            }

            return data.map((stock, index) => `
                <tr onclick="window.location.href='/stock/${stock.code}'">
                    <td>${index + 1}</td>
                    <td>
                        <span class="stock-code">${stock.code}</span>
                        <span class="stock-name"> ${stock.name}</span>
                    </td>
                    <td class="price">${stock.current_price ? stock.current_price.toFixed(1) : '-'}</td>
                    <td class="${stock.avg_return >= 0 ? 'positive' : 'negative'}">
                        ${stock.avg_return >= 0 ? '+' : ''}${stock.avg_return.toFixed(1)}%
                    </td>
                    <td class="win-rate ${getWinRateClass(stock.win_rate)}">
                        ${stock.win_rate.toFixed(0)}%
                        <span class="metric-label">${stock.signal_count} 次訊號</span>
                    </td>
                </tr>
            `).join('');
        }

        function renderCorrelationTable(data, tier) {
            if (!data || data.length === 0) {
                return '<tr><td colspan="4" style="text-align:center;color:#666;">暫無足夠資料</td></tr>';
            }

            return data.map((stock, index) => {
                const corrPercent = Math.abs(stock.correlation) * 100;
                const corrClass = stock.correlation >= 0 ? 'positive' : 'negative';
                return `
                    <tr onclick="window.location.href='/stock/${stock.code}'">
                        <td>${index + 1}</td>
                        <td>
                            <span class="stock-code">${stock.code}</span>
                            <span class="stock-name"> ${stock.name}</span>
                        </td>
                        <td class="price">${stock.current_price ? stock.current_price.toFixed(1) : '-'}</td>
                        <td>
                            <span class="${corrClass}">${stock.correlation >= 0 ? '+' : ''}${stock.correlation.toFixed(3)}</span>
                            <div class="correlation-bar">
                                <div class="correlation-fill ${corrClass}" style="width: ${corrPercent}%"></div>
                            </div>
                            <span class="metric-label">${stock.data_points} 天資料</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderBelowCostTable(data, tier) {
            if (!data || data.length === 0) {
                return '<tr><td colspan="5" style="text-align:center;color:#666;">暫無符合條件的股票</td></tr>';
            }

            return data.map((stock, index) => {
                const discountPct = stock.discount_pct || 0;
                return `
                    <tr onclick="window.location.href='/stock/${stock.code}'">
                        <td>${index + 1}</td>
                        <td>
                            <span class="stock-code">${stock.code}</span>
                            <span class="stock-name"> ${stock.name}</span>
                        </td>
                        <td class="price">${stock.current_price ? stock.current_price.toFixed(1) : '-'}</td>
                        <td class="price">${stock.avg_cost ? stock.avg_cost.toFixed(1) : '-'}</td>
                        <td class="negative">
                            ${discountPct.toFixed(1)}%
                            <span class="metric-label">${stock.buy_days} 天買超</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getTableTitle(type) {
            switch(type) {
                case 'correlation': return '相關係數排行';
                case 'belowcost': return '低於成本排行';
                default: return '勝率排行';
            }
        }

        function getTableHeaders(type) {
            switch(type) {
                case 'correlation':
                    return '<th>相關性</th>';
                case 'belowcost':
                    return '<th>近60日成本</th><th>折價幅度</th>';
                default:
                    return '<th>報酬</th><th>勝率</th>';
            }
        }

        function renderTableBody(data, tier, type) {
            switch(type) {
                case 'correlation':
                    return renderCorrelationTable(data, tier);
                case 'belowcost':
                    return renderBelowCostTable(data, tier);
                default:
                    return renderWinRateTable(data, tier);
            }
        }

        function renderGrid(data, type) {
            const tiers = ['high', 'mid', 'low'];

            return `
                <div class="grid">
                    ${tiers.map(tier => `
                        <div class="card">
                            <div class="card-header">
                                <span class="tier-badge ${tierClasses[tier]}">${tierLabels[tier]}</span>
                                <span class="card-title">${getTableTitle(type)}</span>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>股票</th>
                                        <th>股價</th>
                                        ${getTableHeaders(type)}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderTableBody(data[tier], tier, type)}
                                </tbody>
                            </table>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showTab(tabId) {
            if (!cachedData) return;

            const content = document.getElementById('content');
            let data, type;

            switch(tabId) {
                case 'win5':
                    data = cachedData.win_rate_5d;
                    type = 'winrate';
                    break;
                case 'win10':
                    data = cachedData.win_rate_10d;
                    type = 'winrate';
                    break;
                case 'win30':
                    data = cachedData.win_rate_30d;
                    type = 'winrate';
                    break;
                case 'correlation':
                    data = cachedData.correlation;
                    type = 'correlation';
                    break;
                case 'belowcost':
                    data = cachedData.below_cost;
                    type = 'belowcost';
                    break;
            }

            content.innerHTML = renderGrid(data, type);
        }

        // Tab click handlers
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                showTab(tab.dataset.tab);
            });
        });

        // ETF toggle handler
        document.getElementById('exclude-etf').addEventListener('change', async (e) => {
            excludeEtf = e.target.checked;
            document.getElementById('content').innerHTML = '<div class="loading">載入資料中</div>';
            await fetchData();
            const activeTab = document.querySelector('.tab.active');
            if (activeTab && cachedData) {
                showTab(activeTab.dataset.tab);
            }
        });

        // Fetch and display ETL completion time and data date
        async function updateDataTime() {
            try {
                // Get data date from daily summary
                const summaryResp = await fetch('/api/v1/system/daily-summary');
                const summaryData = await summaryResp.json();
                if (summaryData.date) {
                    document.getElementById('dataDate').textContent = `資料基準日：${summaryData.date} | `;
                }

                // Get ETL completion time
                const resp = await fetch('/api/v1/system/etl-status');
                const data = await resp.json();
                if (data.completed_at) {
                    const dt = new Date(data.completed_at);
                    document.getElementById('timestamp').textContent = `資料更新時間: ${dt.toLocaleString('zh-TW')}`;
                } else if (data.updated_at) {
                    const dt = new Date(data.updated_at);
                    document.getElementById('timestamp').textContent = `資料更新時間: ${dt.toLocaleString('zh-TW')}`;
                }
            } catch (e) {
                console.error('Failed to fetch data time:', e);
            }
        }

        // Initialize
        async function init() {
            await fetchData();
            if (cachedData) {
                showTab('win5');
                await updateDataTime();
            } else {
                document.getElementById('content').innerHTML =
                    '<div class="loading" style="color:#e74c3c;">無法載入資料，請確認 API 服務是否正常運作</div>';
            }
        }

        init();

        // Search functionality
        function goToStock(code) {
            const stockCode = code.trim().toUpperCase();
            if (stockCode && /^[0-9]{4,6}$/.test(stockCode)) {
                window.location.href = `/stock/${stockCode}`;
            } else {
                alert('請輸入有效的股票代號 (4-6位數字)');
            }
        }

        document.getElementById('search-btn').addEventListener('click', () => {
            goToStock(document.getElementById('stock-search').value);
        });

        document.getElementById('stock-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                goToStock(e.target.value);
            }
        });

        // ========== 閒置檢測與頁面可見性管理 ==========
        const IDLE_TIMEOUT = 10 * 60 * 1000; // 10 分鐘
        const IDLE_REDIRECT_URL = 'https://aiinpocket.com';
        const DATA_REFRESH_INTERVAL = 300000; // 5 分鐘

        let lastActivityTime = Date.now();
        let idleCheckInterval = null;
        let dataRefreshInterval = null;
        let isPageVisible = !document.hidden;

        // 重置閒置計時器
        function resetIdleTimer() {
            lastActivityTime = Date.now();
        }

        // 檢查是否閒置超時
        function checkIdleTimeout() {
            if (Date.now() - lastActivityTime > IDLE_TIMEOUT) {
                // 停止所有輪詢
                stopAllPolling();
                // 導向指定頁面
                window.location.href = IDLE_REDIRECT_URL;
            }
        }

        // 監聽用戶活動事件
        ['mousemove', 'mousedown', 'keydown', 'scroll', 'wheel', 'touchstart'].forEach(event => {
            document.addEventListener(event, resetIdleTimer, { passive: true });
        });

        // 頁面可見性變化處理
        document.addEventListener('visibilitychange', () => {
            isPageVisible = !document.hidden;
            if (isPageVisible) {
                // 頁面變為可見，重置閒置計時器並啟動輪詢
                resetIdleTimer();
                startAllPolling();
            } else {
                // 頁面不可見，停止輪詢以節省資源
                stopAllPolling();
            }
        });

        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 5000);
        }

        // 檢查是否在資料更新時段（台北時間 21:00-23:00）
        function checkUpdatePeriod() {
            const banner = document.getElementById('etl-banner');
            const message = document.getElementById('etl-message');

            // 取得台北時間（UTC+8）
            const now = new Date();
            const taipeiHour = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' })).getHours();

            if (taipeiHour >= 21 && taipeiHour < 23) {
                banner.classList.remove('running');
                banner.classList.add('update-period');
                message.textContent = '目前為資料更新時段（21:00-23:00），資料可能正在更新中，請留意資料時間';
            } else {
                banner.classList.remove('update-period');
                banner.classList.remove('running');
            }
        }

        async function refreshData() {
            if (!isPageVisible) return;

            await fetchData();
            const activeTab = document.querySelector('.tab.active');
            if (activeTab) {
                showTab(activeTab.dataset.tab);
            }
            await updateDataTime();
        }

        function startAllPolling() {
            // 閒置檢測（每 30 秒檢查一次）
            if (!idleCheckInterval) {
                idleCheckInterval = setInterval(checkIdleTimeout, 30000);
            }

            // 檢查是否在資料更新時段（頁面載入時檢查一次即可）
            checkUpdatePeriod();

            // 資料刷新（每 5 分鐘）
            if (!dataRefreshInterval) {
                dataRefreshInterval = setInterval(refreshData, DATA_REFRESH_INTERVAL);
            }
        }

        function stopAllPolling() {
            if (idleCheckInterval) {
                clearInterval(idleCheckInterval);
                idleCheckInterval = null;
            }
            if (dataRefreshInterval) {
                clearInterval(dataRefreshInterval);
                dataRefreshInterval = null;
            }
        }

        // 頁面載入時啟動輪詢
        if (isPageVisible) {
            startAllPolling();
        }
    </script>
</body>
</html>
