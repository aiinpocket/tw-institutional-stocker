<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- Google Analytics (動態載入) -->
    <script>
        (async function() {
            try {
                const res = await fetch('/api/v1/system/config');
                const config = await res.json();
                if (config.ga_measurement_id) {
                    const script = document.createElement('script');
                    script.async = true;
                    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + config.ga_measurement_id;
                    document.head.appendChild(script);
                    window.dataLayer = window.dataLayer || [];
                    function gtag(){dataLayer.push(arguments);}
                    window.gtag = gtag;
                    gtag('js', new Date());
                    gtag('config', config.ga_measurement_id);
                }
            } catch (e) { console.warn('GA init failed:', e); }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產業資金流向熱力圖 | Industry Heatmap</title>
    <meta name="description" content="台股產業資金流向熱力圖，視覺化呈現各產業法人買賣超情況，快速掌握資金流向趨勢。">
    <meta name="keywords" content="台股,產業熱力圖,資金流向,產業分析,法人買賣超">
    <link rel="canonical" href="https://stock-tw.aiinpocket.com/industry">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://stock-tw.aiinpocket.com/industry">
    <meta property="og:title" content="產業資金流向熱力圖 | Industry Heatmap">
    <meta property="og:description" content="台股產業資金流向熱力圖，視覺化呈現各產業法人買賣超情況。">
    <meta property="og:site_name" content="台股法人籌碼分析">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="產業資金流向熱力圖 | Industry Heatmap">
    <meta name="twitter:description" content="台股產業資金流向熱力圖，視覺化呈現各產業法人買賣超情況。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 0.95rem; }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #00d4ff;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 28px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab:hover { background: rgba(255,255,255,0.15); }
        .tab.active {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
        }
        .heatmap-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        .heatmap-cell {
            padding: 20px 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .heatmap-cell:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .heatmap-cell .industry-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .heatmap-cell .net-value {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .heatmap-cell .stock-count {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        .rotation-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .rotation-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .rotation-card .industry-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .rotation-card .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }
        .rotation-card .stat-label { color: #888; }
        .rotation-card .stat-value { font-weight: 600; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }
        .status-strong { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .status-turning-up { background: linear-gradient(90deg, #3498db, #2980b9); }
        .status-turning-down { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .status-weak { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .status-neutral { background: rgba(255,255,255,0.2); }
        /* 台灣慣例：紅色=上漲/買超，綠色=下跌/賣超 */
        .positive { color: #ef5350; }
        .negative { color: #26a69a; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal.active { display: block; }
        .modal-content {
            max-width: 900px;
            margin: 20px auto;
            background: #1a1a2e;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header h2 { font-size: 1.5rem; }
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-btn:hover { color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; }
        th { color: #888; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th.sortable { cursor: pointer; user-select: none; transition: color 0.3s; }
        th.sortable:hover { color: #00d4ff; }
        th.sortable::after { content: ' ↕'; opacity: 0.3; font-size: 0.7rem; }
        th.sortable.asc::after { content: ' ↑'; opacity: 1; color: #00d4ff; }
        th.sortable.desc::after { content: ' ↓'; opacity: 1; color: #00d4ff; }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(255,255,255,0.03); }
        .stock-code { color: #00d4ff; cursor: pointer; }
        .stock-code:hover { text-decoration: underline; }
        .loading { text-align: center; padding: 60px; color: #888; }
        footer { text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 0.85rem; }

        /* 資料更新時段提示 */
        .update-period-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(230, 126, 34, 0.2), rgba(211, 84, 0, 0.2));
            border: 2px solid rgba(230, 126, 34, 0.6);
            color: #e67e22;
            font-weight: 600;
            font-size: 1rem;
            animation: slideDown 0.3s ease;
        }
        .update-period-banner.show { display: flex; }
        .update-period-banner::before { content: '⚠️'; font-size: 1.3rem; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>產業資金流向熱力圖</h1>
            <p class="subtitle">Industry Capital Flow Heatmap</p>
            <div class="nav-links">
                <a href="/dashboard">📊 策略儀表板</a>
                <a href="/live">📈 今日總結</a>
                <a href="/rankings">🏆 法人排行榜</a>
                <a href="/margin">💰 融資融券</a>
                <a href="/revenue">📋 營收追蹤</a>
                <a href="/ai">🤖 AI 分析</a>
                <a href="/brokers">🏦 券商追蹤</a>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="heatmap">熱力圖</div>
            <div class="tab" data-tab="rotation">產業輪動</div>
            <div class="tab" data-tab="summary">資金流向</div>
        </div>

        <!-- 資料更新時段提示 -->
        <div id="update-period-banner" class="update-period-banner">
            <span>目前為資料更新時段（21:00-23:00），資料可能正在更新中，請留意資料時間</span>
        </div>

        <div id="content">
            <div class="loading">載入資料中...</div>
        </div>

        <footer>
            <div id="dataDate" style="color: #00d4ff; margin-bottom: 5px;">資料基準日：載入中...</div>
            <div>資料來源：台灣證券交易所、櫃買中心 | 紅色代表買超、綠色代表賣超</div>
            <div style="margin-top: 10px;">
                <a href="https://github.com/aiinpocket/tw-institutional-stocker" target="_blank" rel="noopener" style="color: #888; text-decoration: none;">
                    <svg height="16" width="16" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 5px; fill: currentColor;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    開源專案 Open Source
                </a>
            </div>
        </footer>
    </div>

    <!-- 產業個股 Modal -->
    <div id="industry-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">產業個股</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/industry';
        let currentDays = 5;

        function getHeatColor(intensity) {
            if (intensity > 50) return `rgba(231, 76, 60, ${0.3 + intensity/200})`;
            if (intensity > 20) return `rgba(231, 76, 60, ${0.2 + intensity/300})`;
            if (intensity > 0) return `rgba(231, 76, 60, 0.15)`;
            if (intensity > -20) return `rgba(46, 204, 113, 0.15)`;
            if (intensity > -50) return `rgba(46, 204, 113, ${0.2 + Math.abs(intensity)/300})`;
            return `rgba(46, 204, 113, ${0.3 + Math.abs(intensity)/200})`;
        }

        function formatNumber(num) {
            if (Math.abs(num) >= 10000) return (num/10000).toFixed(1) + '萬';
            if (Math.abs(num) >= 1000) return (num/1000).toFixed(1) + '千';
            return num.toFixed(0);
        }

        async function loadHeatmap() {
            try {
                const resp = await fetch(`${API_BASE}/heatmap?days=${currentDays}`);
                const data = await resp.json();

                const html = `
                    <div class="heatmap-container">
                        ${data.items.map(item => `
                            <div class="heatmap-cell"
                                 style="background: ${getHeatColor(item.intensity)}"
                                 onclick="showIndustryStocks('${item.industry}')">
                                <div class="industry-name">${item.industry}</div>
                                <div class="net-value ${item.total_net >= 0 ? 'positive' : 'negative'}">
                                    ${item.total_net >= 0 ? '+' : ''}${formatNumber(item.total_net)}
                                </div>
                                <div class="stock-count">強度: ${item.intensity.toFixed(0)}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading">載入失敗</div>';
            }
        }

        async function loadRotation() {
            try {
                const resp = await fetch(`${API_BASE}/rotation`);
                const data = await resp.json();

                const statusClass = {
                    '強勢加碼': 'status-strong',
                    '轉強': 'status-turning-up',
                    '轉弱': 'status-turning-down',
                    '持續弱勢': 'status-weak',
                    '短期買超': 'status-turning-up',
                    '短期賣超': 'status-turning-down',
                    '觀望': 'status-neutral'
                };

                const html = `
                    <div class="rotation-container">
                        ${data.items.map(item => `
                            <div class="rotation-card" onclick="showIndustryStocks('${item.industry}')">
                                <div class="industry-name">${item.industry}</div>
                                <div class="stats">
                                    <div>
                                        <div class="stat-label">5日淨買賣</div>
                                        <div class="stat-value ${item.net_5d >= 0 ? 'positive' : 'negative'}">
                                            ${item.net_5d >= 0 ? '+' : ''}${formatNumber(item.net_5d)}
                                        </div>
                                    </div>
                                    <div>
                                        <div class="stat-label">20日淨買賣</div>
                                        <div class="stat-value ${item.net_20d >= 0 ? 'positive' : 'negative'}">
                                            ${item.net_20d >= 0 ? '+' : ''}${formatNumber(item.net_20d)}
                                        </div>
                                    </div>
                                </div>
                                <span class="status-badge ${statusClass[item.status] || 'status-neutral'}">${item.status}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading">載入失敗</div>';
            }
        }

        // Store summary data for sorting
        let summaryData = [];
        let summarySort = { column: 'total_net', direction: 'desc' };

        async function loadSummary() {
            try {
                const resp = await fetch(`${API_BASE}/summary?days=${currentDays}`);
                const data = await resp.json();
                summaryData = data.items;
                renderSummaryTable();
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading">載入失敗</div>';
            }
        }

        function renderSummaryTable() {
            // Sort data
            const sorted = [...summaryData].sort((a, b) => {
                let aVal = a[summarySort.column];
                let bVal = b[summarySort.column];
                if (summarySort.column === 'industry') {
                    return summarySort.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                }
                return summarySort.direction === 'asc' ? aVal - bVal : bVal - aVal;
            });

            const getSortClass = (col) => {
                if (summarySort.column === col) return `sortable ${summarySort.direction}`;
                return 'sortable';
            };

            const html = `
                <table>
                    <thead>
                        <tr>
                            <th class="${getSortClass('industry')}" onclick="sortSummary('industry')">產業</th>
                            <th class="${getSortClass('foreign_net')}" onclick="sortSummary('foreign_net')">外資</th>
                            <th class="${getSortClass('trust_net')}" onclick="sortSummary('trust_net')">投信</th>
                            <th class="${getSortClass('dealer_net')}" onclick="sortSummary('dealer_net')">自營商</th>
                            <th class="${getSortClass('total_net')}" onclick="sortSummary('total_net')">合計</th>
                            <th class="${getSortClass('stock_count')}" onclick="sortSummary('stock_count')">股票數</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sorted.map(item => `
                            <tr onclick="showIndustryStocks('${item.industry}')" style="cursor:pointer">
                                <td><strong>${item.industry}</strong></td>
                                <td class="${item.foreign_net >= 0 ? 'positive' : 'negative'}">${formatNumber(item.foreign_net)}</td>
                                <td class="${item.trust_net >= 0 ? 'positive' : 'negative'}">${formatNumber(item.trust_net)}</td>
                                <td class="${item.dealer_net >= 0 ? 'positive' : 'negative'}">${formatNumber(item.dealer_net)}</td>
                                <td class="${item.total_net >= 0 ? 'positive' : 'negative'}"><strong>${formatNumber(item.total_net)}</strong></td>
                                <td>${item.stock_count}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('content').innerHTML = html;
        }

        function sortSummary(column) {
            if (summarySort.column === column) {
                summarySort.direction = summarySort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                summarySort.column = column;
                summarySort.direction = column === 'industry' ? 'asc' : 'desc';
            }
            renderSummaryTable();
        }

        async function showIndustryStocks(industry) {
            document.getElementById('modal-title').textContent = `${industry} - 個股明細`;
            document.getElementById('modal-body').innerHTML = '<div class="loading">載入中...</div>';
            document.getElementById('industry-modal').classList.add('active');

            try {
                const resp = await fetch(`${API_BASE}/${encodeURIComponent(industry)}/stocks?days=${currentDays}`);
                const data = await resp.json();

                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>股票</th>
                                <th>股價</th>
                                <th>漲跌%</th>
                                <th>外資</th>
                                <th>投信</th>
                                <th>自營</th>
                                <th>合計</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.items.map(s => `
                                <tr>
                                    <td>
                                        <span class="stock-code" onclick="window.location='/stock/${s.code}'">${s.code}</span>
                                        ${s.name}
                                    </td>
                                    <td>${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                    <td class="${(s.change_percent||0) >= 0 ? 'positive' : 'negative'}">
                                        ${s.change_percent ? s.change_percent.toFixed(2) + '%' : '-'}
                                    </td>
                                    <td class="${s.foreign_net >= 0 ? 'positive' : 'negative'}">${formatNumber(s.foreign_net)}</td>
                                    <td class="${s.trust_net >= 0 ? 'positive' : 'negative'}">${formatNumber(s.trust_net)}</td>
                                    <td class="${s.dealer_net >= 0 ? 'positive' : 'negative'}">${formatNumber(s.dealer_net)}</td>
                                    <td class="${s.total_net >= 0 ? 'positive' : 'negative'}"><strong>${formatNumber(s.total_net)}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('modal-body').innerHTML = html;
            } catch (e) {
                document.getElementById('modal-body').innerHTML = '<div class="loading">載入失敗</div>';
            }
        }

        function closeModal() {
            document.getElementById('industry-modal').classList.remove('active');
        }

        document.getElementById('industry-modal').addEventListener('click', (e) => {
            if (e.target.id === 'industry-modal') closeModal();
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabId = tab.dataset.tab;
                if (tabId === 'heatmap') loadHeatmap();
                else if (tabId === 'rotation') loadRotation();
                else if (tabId === 'summary') loadSummary();
            });
        });

        // Load data date
        async function loadDataDate() {
            try {
                const resp = await fetch('/api/v1/system/daily-summary');
                const data = await resp.json();
                if (data.date) {
                    document.getElementById('dataDate').textContent = `資料基準日：${data.date}`;
                }
            } catch (e) {
                document.getElementById('dataDate').textContent = '資料基準日：載入失敗';
            }
        }

        // 檢查是否在資料更新時段（台北時間 21:00-23:00）
        function checkUpdatePeriod() {
            const banner = document.getElementById('update-period-banner');
            const now = new Date();
            const taipeiHour = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' })).getHours();
            if (taipeiHour >= 21 && taipeiHour < 23) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        checkUpdatePeriod();
        loadHeatmap();
        loadDataDate();
    </script>
</body>
</html>
