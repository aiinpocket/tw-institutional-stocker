<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日總結 | Daily Summary</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 0.95rem; }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #00d4ff;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-dot.live { background: #2ecc71; }
        .status-dot.delayed { background: #f39c12; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .update-time { color: #888; font-size: 0.85rem; }
        .refresh-btn {
            padding: 8px 16px;
            background: rgba(0,212,255,0.2);
            border: 1px solid #00d4ff;
            border-radius: 20px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        .refresh-btn:hover { background: rgba(0,212,255,0.3); }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header .icon { font-size: 1.5rem; }
        .card-title { font-size: 1.1rem; }
        .badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-up { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .badge-down { background: rgba(231,76,60,0.2); color: #e74c3c; }
        .badge-neutral { background: rgba(255,255,255,0.1); color: #888; }
        .market-summary {
            display: flex;
            justify-content: space-around;
            text-align: center;
            padding: 10px 0;
        }
        .market-item h3 { font-size: 1.8rem; margin-bottom: 5px; }
        .market-item .label { color: #888; font-size: 0.85rem; }
        .market-item .change { font-size: 0.9rem; margin-top: 3px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; text-align: left; }
        th { color: #888; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        tr { cursor: pointer; transition: background 0.2s; }
        tr:hover { background: rgba(0,212,255,0.05); }
        .stock-code { color: #00d4ff; font-weight: 600; }
        .stock-name { color: #aaa; font-size: 0.8rem; }
        .positive { color: #2ecc71; }
        .negative { color: #e74c3c; }
        .neutral { color: #888; }
        .loading { text-align: center; padding: 30px; color: #888; }
        .flow-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
        }
        .flow-buy { background: #2ecc71; }
        .flow-sell { background: #e74c3c; }
        .industry-chip {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .industry-hot { background: rgba(231,76,60,0.3); border: 1px solid #e74c3c; }
        .industry-cold { background: rgba(46,204,113,0.3); border: 1px solid #2ecc71; }
        footer { text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 0.85rem; }
        @media (max-width: 1200px) {
            .grid-3 { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 今日總結</h1>
            <p class="subtitle">Daily Market Summary</p>
            <div class="nav-links">
                <a href="/dashboard">📊 策略儀表板</a>
                <a href="/rankings">🏆 法人排行榜</a>
                <a href="/industry">🏭 產業熱力圖</a>
                <a href="/ai">🤖 AI 分析</a>
                <a href="/brokers">🏦 券商追蹤</a>
            </div>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot delayed"></span>
                <span>盤後資料</span>
            </div>
            <div class="update-time" id="updateTime">最後更新：載入中...</div>
            <button class="refresh-btn" onclick="refreshAll()">🔄 重新整理</button>
        </div>

        <div class="grid-3">
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">📊</span>
                        <span class="card-title">市場概況</span>
                    </div>
                </div>
                <div class="market-summary" id="marketSummary">
                    <div class="loading">載入中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">💰</span>
                        <span class="card-title">法人買賣超</span>
                    </div>
                </div>
                <div id="institutionalFlow">
                    <div class="loading">載入中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">🔥</span>
                        <span class="card-title">熱門產業</span>
                    </div>
                </div>
                <div id="hotIndustries">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">🚀</span>
                        <span class="card-title">外資買超前 10</span>
                    </div>
                    <span class="badge badge-up">買超</span>
                </div>
                <div id="foreignBuy">
                    <div class="loading">載入中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">📉</span>
                        <span class="card-title">外資賣超前 10</span>
                    </div>
                    <span class="badge badge-down">賣超</span>
                </div>
                <div id="foreignSell">
                    <div class="loading">載入中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">💎</span>
                        <span class="card-title">投信買超前 10</span>
                    </div>
                    <span class="badge badge-up">買超</span>
                </div>
                <div id="trustBuy">
                    <div class="loading">載入中...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-header-left">
                        <span class="icon">🏃</span>
                        <span class="card-title">投信賣超前 10</span>
                    </div>
                    <span class="badge badge-down">賣超</span>
                </div>
                <div id="trustSell">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>

        <footer>
            <div>資料來源：台灣證券交易所、櫃買中心 | 每日盤後更新</div>
        </footer>
    </div>

    <script>
        function formatNumber(num) {
            if (Math.abs(num) >= 100000000) return (num/100000000).toFixed(2) + '億';
            if (Math.abs(num) >= 10000) return (num/10000).toFixed(1) + '萬';
            return num.toFixed(0);
        }

        function formatChange(change) {
            if (change > 0) return `<span class="positive">+${change.toFixed(2)}%</span>`;
            if (change < 0) return `<span class="negative">${change.toFixed(2)}%</span>`;
            return `<span class="neutral">0.00%</span>`;
        }

        // Global cached data
        let cachedSummary = null;

        async function loadAllFromCache() {
            // Try to load from pre-computed cache first
            try {
                const resp = await fetch('/api/v1/system/daily-summary');
                const data = await resp.json();

                if (data.date) {
                    cachedSummary = data;

                    // Market summary
                    const market = data.market || {};
                    document.getElementById('marketSummary').innerHTML = `
                        <div class="market-item">
                            <h3 class="positive">${market.up || 0}</h3>
                            <div class="label">上漲</div>
                        </div>
                        <div class="market-item">
                            <h3 class="negative">${market.down || 0}</h3>
                            <div class="label">下跌</div>
                        </div>
                        <div class="market-item">
                            <h3 class="neutral">${market.unchanged || 0}</h3>
                            <div class="label">平盤</div>
                        </div>
                    `;

                    // Institutional flow
                    const flow = data.institutional_flow || {};
                    document.getElementById('institutionalFlow').innerHTML = `
                        <table>
                            <tr>
                                <td>外資</td>
                                <td class="${(flow.foreign || 0) >= 0 ? 'positive' : 'negative'}">${(flow.foreign || 0) >= 0 ? '+' : ''}${formatNumber(flow.foreign || 0)}</td>
                            </tr>
                            <tr>
                                <td>投信</td>
                                <td class="${(flow.trust || 0) >= 0 ? 'positive' : 'negative'}">${(flow.trust || 0) >= 0 ? '+' : ''}${formatNumber(flow.trust || 0)}</td>
                            </tr>
                            <tr>
                                <td>自營商</td>
                                <td class="${(flow.dealer || 0) >= 0 ? 'positive' : 'negative'}">${(flow.dealer || 0) >= 0 ? '+' : ''}${formatNumber(flow.dealer || 0)}</td>
                            </tr>
                        </table>
                    `;

                    // Hot industries
                    if (data.hot_industries && data.hot_industries.length > 0) {
                        document.getElementById('hotIndustries').innerHTML = data.hot_industries.slice(0, 8).map(ind => {
                            const isHot = (ind.total_net || 0) > 0;
                            return `<span class="industry-chip ${isHot ? 'industry-hot' : 'industry-cold'}" onclick="window.location='/industry'">${ind.industry} ${isHot ? '🔥' : '❄️'}</span>`;
                        }).join('');
                    } else {
                        loadHotIndustries();
                    }

                    // Rankings from cache
                    if (data.foreign_buy_top10) {
                        document.getElementById('foreignBuy').innerHTML = renderRankingTable(data.foreign_buy_top10, 'net', true);
                    }
                    if (data.foreign_sell_top10) {
                        document.getElementById('foreignSell').innerHTML = renderRankingTable(data.foreign_sell_top10, 'net', false);
                    }
                    if (data.trust_buy_top10) {
                        document.getElementById('trustBuy').innerHTML = renderRankingTable(data.trust_buy_top10, 'net', true);
                    }
                    if (data.trust_sell_top10) {
                        document.getElementById('trustSell').innerHTML = renderRankingTable(data.trust_sell_top10, 'net', false);
                    }

                    // If rankings not in cache, load separately
                    if (!data.foreign_buy_top10) {
                        loadRankings();
                    }

                    return true;
                }
            } catch (e) {
                console.log('Cache not available, falling back to individual queries');
            }
            return false;
        }

        function renderRankingTable(items, field, isPositive) {
            if (!items || items.length === 0) {
                return '<div class="loading">暫無資料</div>';
            }
            return `
                <table>
                    <thead>
                        <tr><th>股票</th><th>買賣超</th></tr>
                    </thead>
                    <tbody>
                        ${items.map(s => `
                            <tr onclick="window.location='/stock/${s.code}'">
                                <td>
                                    <span class="stock-code">${s.code}</span>
                                    <span class="stock-name">${s.name || ''}</span>
                                </td>
                                <td class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${formatNumber(s[field] || 0)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function loadMarketSummary() {
            if (cachedSummary && cachedSummary.market) return;
            try {
                const resp = await fetch('/api/v1/prices/summary');
                const data = await resp.json();

                document.getElementById('marketSummary').innerHTML = `
                    <div class="market-item">
                        <h3 class="positive">${data.up || 0}</h3>
                        <div class="label">上漲</div>
                    </div>
                    <div class="market-item">
                        <h3 class="negative">${data.down || 0}</h3>
                        <div class="label">下跌</div>
                    </div>
                    <div class="market-item">
                        <h3 class="neutral">${data.unchanged || 0}</h3>
                        <div class="label">平盤</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('marketSummary').innerHTML = '<div class="loading" style="color:#888">載入失敗</div>';
            }
        }

        async function loadInstitutionalFlow() {
            if (cachedSummary && cachedSummary.institutional_flow) return;
            try {
                const resp = await fetch('/api/v1/institutional/flows?limit=1');
                const data = await resp.json();

                if (!data.items || data.items.length === 0) {
                    document.getElementById('institutionalFlow').innerHTML = '<div class="loading">暫無資料</div>';
                    return;
                }

                let foreignNet = 0, trustNet = 0, dealerNet = 0;
                data.items.forEach(item => {
                    foreignNet += item.foreign_net || 0;
                    trustNet += item.trust_net || 0;
                    dealerNet += item.dealer_net || 0;
                });

                document.getElementById('institutionalFlow').innerHTML = `
                    <table>
                        <tr>
                            <td>外資</td>
                            <td class="${foreignNet >= 0 ? 'positive' : 'negative'}">${foreignNet >= 0 ? '+' : ''}${formatNumber(foreignNet)}</td>
                        </tr>
                        <tr>
                            <td>投信</td>
                            <td class="${trustNet >= 0 ? 'positive' : 'negative'}">${trustNet >= 0 ? '+' : ''}${formatNumber(trustNet)}</td>
                        </tr>
                        <tr>
                            <td>自營商</td>
                            <td class="${dealerNet >= 0 ? 'positive' : 'negative'}">${dealerNet >= 0 ? '+' : ''}${formatNumber(dealerNet)}</td>
                        </tr>
                    </table>
                `;
            } catch (e) {
                document.getElementById('institutionalFlow').innerHTML = '<div class="loading" style="color:#888">載入失敗</div>';
            }
        }

        async function loadHotIndustries() {
            try {
                const resp = await fetch('/api/v1/industry/summary?limit=10');
                const data = await resp.json();

                if (!data.items || data.items.length === 0) {
                    document.getElementById('hotIndustries').innerHTML = '<div class="loading">暫無資料</div>';
                    return;
                }

                const sorted = data.items.sort((a, b) => Math.abs(b.total_net || 0) - Math.abs(a.total_net || 0));

                document.getElementById('hotIndustries').innerHTML = sorted.slice(0, 8).map(ind => {
                    const isHot = (ind.total_net || 0) > 0;
                    return `<span class="industry-chip ${isHot ? 'industry-hot' : 'industry-cold'}" onclick="window.location='/industry'">${ind.industry} ${isHot ? '🔥' : '❄️'}</span>`;
                }).join('');
            } catch (e) {
                document.getElementById('hotIndustries').innerHTML = '<div class="loading" style="color:#888">載入失敗</div>';
            }
        }

        async function loadRankings() {
            if (cachedSummary && cachedSummary.foreign_buy_top10) return;
            try {
                const resp = await fetch('/api/v1/institutional/flows?limit=500');
                const data = await resp.json();

                if (!data.items || data.items.length === 0) {
                    ['foreignBuy', 'foreignSell', 'trustBuy', 'trustSell'].forEach(id => {
                        document.getElementById(id).innerHTML = '<div class="loading">暫無資料</div>';
                    });
                    return;
                }

                const foreignBuyers = data.items.filter(s => (s.foreign_net || 0) > 0).sort((a, b) => (b.foreign_net || 0) - (a.foreign_net || 0)).slice(0, 10);
                const foreignSellers = data.items.filter(s => (s.foreign_net || 0) < 0).sort((a, b) => (a.foreign_net || 0) - (b.foreign_net || 0)).slice(0, 10);
                const trustBuyers = data.items.filter(s => (s.trust_net || 0) > 0).sort((a, b) => (b.trust_net || 0) - (a.trust_net || 0)).slice(0, 10);
                const trustSellers = data.items.filter(s => (s.trust_net || 0) < 0).sort((a, b) => (a.trust_net || 0) - (b.trust_net || 0)).slice(0, 10);

                const renderTable = (items, field, isPositive) => `
                    <table>
                        <thead>
                            <tr><th>股票</th><th>買賣超</th></tr>
                        </thead>
                        <tbody>
                            ${items.map(s => `
                                <tr onclick="window.location='/stock/${s.code}'">
                                    <td>
                                        <span class="stock-code">${s.code}</span>
                                        <span class="stock-name">${s.name || ''}</span>
                                    </td>
                                    <td class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${formatNumber(s[field] || 0)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('foreignBuy').innerHTML = foreignBuyers.length ? renderTable(foreignBuyers, 'foreign_net', true) : '<div class="loading">暫無資料</div>';
                document.getElementById('foreignSell').innerHTML = foreignSellers.length ? renderTable(foreignSellers, 'foreign_net', false) : '<div class="loading">暫無資料</div>';
                document.getElementById('trustBuy').innerHTML = trustBuyers.length ? renderTable(trustBuyers, 'trust_net', true) : '<div class="loading">暫無資料</div>';
                document.getElementById('trustSell').innerHTML = trustSellers.length ? renderTable(trustSellers, 'trust_net', false) : '<div class="loading">暫無資料</div>';

            } catch (e) {
                ['foreignBuy', 'foreignSell', 'trustBuy', 'trustSell'].forEach(id => {
                    document.getElementById(id).innerHTML = '<div class="loading" style="color:#888">載入失敗</div>';
                });
            }
        }

        async function updateTime() {
            try {
                const resp = await fetch('/api/v1/system/etl-status');
                const data = await resp.json();
                if (data.completed_at) {
                    const dt = new Date(data.completed_at);
                    document.getElementById('updateTime').textContent = `資料更新時間：${dt.toLocaleString('zh-TW')}`;
                } else if (data.updated_at) {
                    const dt = new Date(data.updated_at);
                    document.getElementById('updateTime').textContent = `資料更新時間：${dt.toLocaleString('zh-TW')}`;
                } else {
                    document.getElementById('updateTime').textContent = '資料更新時間：未知';
                }
            } catch (e) {
                document.getElementById('updateTime').textContent = '資料更新時間：載入失敗';
            }
        }

        async function refreshAll() {
            document.querySelectorAll('.card > div:not(.card-header)').forEach(el => {
                if (el.id) el.innerHTML = '<div class="loading">載入中...</div>';
            });

            // Try cache first, then fallback to individual queries
            cachedSummary = null;
            const cacheLoaded = await loadAllFromCache();

            if (!cacheLoaded) {
                loadMarketSummary();
                loadInstitutionalFlow();
                loadHotIndustries();
                loadRankings();
            }

            updateTime();
        }

        // Initial load
        refreshAll();

        // Auto refresh every 5 minutes
        setInterval(refreshAll, 5 * 60 * 1000);
    </script>
</body>
</html>
