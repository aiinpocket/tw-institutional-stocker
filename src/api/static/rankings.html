<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法人排行榜 | Institutional Rankings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 0.95rem; }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #00d4ff;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .tab:hover { background: rgba(255,255,255,0.15); }
        .tab.active {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-header .icon { font-size: 1.5rem; }
        .card-title { font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 8px; text-align: left; }
        th { color: #888; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        tr { cursor: pointer; transition: background 0.2s; }
        tr:hover { background: rgba(0,212,255,0.05); }
        .stock-code { color: #00d4ff; font-weight: 600; }
        .stock-name { color: #aaa; font-size: 0.85rem; }
        .positive { color: #2ecc71; }
        .negative { color: #e74c3c; }
        .days-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .days-high { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .days-mid { background: linear-gradient(90deg, #f39c12, #d68910); }
        .days-low { background: linear-gradient(90deg, #27ae60, #1e8449); }
        .loading { text-align: center; padding: 40px; color: #888; }
        .price { color: #888; }
        .industry-tag {
            font-size: 0.75rem;
            color: #888;
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 8px;
        }
        footer { text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 0.85rem; }
        .today-section { margin-bottom: 30px; }
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border-left: 4px solid #00d4ff;
        }
        .data-date-banner {
            text-align: center;
            padding: 15px 20px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, rgba(0,212,255,0.1), rgba(123,44,191,0.1));
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 10px;
            font-size: 1.1rem;
            color: #e0e0e0;
        }
        .data-date-banner strong {
            color: #00d4ff;
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 法人排行榜</h1>
            <p class="subtitle">Institutional Investor Rankings</p>
            <div class="nav-links">
                <a href="/dashboard">📊 策略儀表板</a>
                <a href="/live">📈 即時看板</a>
                <a href="/industry">🏭 產業熱力圖</a>
                <a href="/ai">🤖 AI 分析</a>
                <a href="/brokers">🏦 券商追蹤</a>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="today">📊 本日買賣超</div>
            <div class="tab" data-tab="consecutive">🔥 外資連買</div>
            <div class="tab" data-tab="trust">💎 投信認養</div>
            <div class="tab" data-tab="sync">🎯 三大法人同步</div>
            <div class="tab" data-tab="deviation">📉 乖離過大</div>
        </div>

        <div id="content">
            <div class="loading">載入資料中...</div>
        </div>

        <footer>
            <div id="data-time" style="margin-bottom: 10px; color: #888;">資料更新時間：載入中...</div>
            <div>資料來源：台灣證券交易所、櫃買中心 | 每日盤後更新</div>
        </footer>
    </div>

    <script>
        const API_BASE = '/api/v1/strategy';

        async function updateDataTime() {
            try {
                const resp = await fetch('/api/v1/system/etl-status');
                const data = await resp.json();
                if (data.completed_at) {
                    const dt = new Date(data.completed_at);
                    document.getElementById('data-time').textContent = `資料更新時間：${dt.toLocaleString('zh-TW')}`;
                } else if (data.updated_at) {
                    const dt = new Date(data.updated_at);
                    document.getElementById('data-time').textContent = `資料更新時間：${dt.toLocaleString('zh-TW')}`;
                } else {
                    document.getElementById('data-time').textContent = '資料更新時間：未知';
                }
            } catch (e) {
                document.getElementById('data-time').textContent = '資料更新時間：載入失敗';
            }
        }

        function formatNumber(num) {
            if (Math.abs(num) >= 10000) return (num/10000).toFixed(1) + '萬';
            if (Math.abs(num) >= 1000) return (num/1000).toFixed(1) + '千';
            return num.toFixed(0);
        }

        function getDaysBadgeClass(days) {
            if (days >= 10) return 'days-high';
            if (days >= 5) return 'days-mid';
            return 'days-low';
        }

        function flattenRankings(data) {
            if (!data.rankings) return [];
            return [...(data.rankings.high || []), ...(data.rankings.mid || []), ...(data.rankings.low || [])];
        }

        async function loadToday() {
            try {
                const resp = await fetch('/api/v1/institutional/flows?limit=2000');
                const data = await resp.json();

                // 取得資料日期
                const dataDate = data.date || '未知';
                const totalRecords = data.total || 0;

                if (!data.items || data.items.length === 0) {
                    document.getElementById('content').innerHTML = `
                        <div class="card">
                            <div class="loading">
                                <p>暫無法人買賣超資料</p>
                                <p style="font-size: 0.85rem; margin-top: 10px;">資料庫最後更新日期：${dataDate}</p>
                            </div>
                        </div>`;
                    return;
                }

                const items = data.items;

                // Sort and get top 10 for each category
                const foreignBuy = items.filter(s => (s.foreign_net || 0) > 0).sort((a, b) => b.foreign_net - a.foreign_net).slice(0, 10);
                const foreignSell = items.filter(s => (s.foreign_net || 0) < 0).sort((a, b) => a.foreign_net - b.foreign_net).slice(0, 10);
                const trustBuy = items.filter(s => (s.trust_net || 0) > 0).sort((a, b) => b.trust_net - a.trust_net).slice(0, 10);
                const trustSell = items.filter(s => (s.trust_net || 0) < 0).sort((a, b) => a.trust_net - b.trust_net).slice(0, 10);
                const dealerBuy = items.filter(s => (s.dealer_net || 0) > 0).sort((a, b) => b.dealer_net - a.dealer_net).slice(0, 10);
                const dealerSell = items.filter(s => (s.dealer_net || 0) < 0).sort((a, b) => a.dealer_net - b.dealer_net).slice(0, 10);

                const renderTable = (items, field, isPositive, title, icon, emptyMsg) => `
                    <div class="card">
                        <div class="card-header">
                            <span class="icon">${icon}</span>
                            <span class="card-title">${title}</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>股票</th>
                                    <th>買賣超 (張)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.length ? items.map((s, i) => `
                                    <tr onclick="window.location='/stock/${s.code}'">
                                        <td>${i + 1}</td>
                                        <td>
                                            <span class="stock-code">${s.code}</span>
                                            <span class="stock-name">${s.name || ''}</span>
                                        </td>
                                        <td class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${formatNumber(s[field] || 0)}</td>
                                    </tr>
                                `).join('') : `<tr><td colspan="3" class="loading">${emptyMsg}</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                `;

                const html = `
                    <div class="data-date-banner">
                        📅 資料日期：<strong>${dataDate}</strong>（共 ${totalRecords} 筆記錄）
                    </div>
                    <div class="today-section">
                        <h3 class="section-title">🏦 外資</h3>
                        <div class="grid">
                            ${renderTable(foreignBuy, 'foreign_net', true, '買超前10', '🚀', '當日無外資買超記錄')}
                            ${renderTable(foreignSell, 'foreign_net', false, '賣超前10', '📉', '當日無外資賣超記錄')}
                        </div>
                    </div>
                    <div class="today-section">
                        <h3 class="section-title">💎 投信</h3>
                        <div class="grid">
                            ${renderTable(trustBuy, 'trust_net', true, '買超前10', '🚀', '當日無投信買超記錄')}
                            ${renderTable(trustSell, 'trust_net', false, '賣超前10', '📉', '當日無投信賣超記錄')}
                        </div>
                    </div>
                    <div class="today-section">
                        <h3 class="section-title">🏢 自營商</h3>
                        <div class="grid">
                            ${renderTable(dealerBuy, 'dealer_net', true, '買超前10', '🚀', '當日無自營商買超記錄')}
                            ${renderTable(dealerSell, 'dealer_net', false, '賣超前10', '📉', '當日無自營商賣超記錄')}
                        </div>
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗，請稍後再試</div>';
            }
        }

        async function loadConsecutive() {
            try {
                const resp = await fetch(`${API_BASE}/consecutive-buying?limit=30`);
                const data = await resp.json();
                const items = flattenRankings(data);

                if (items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">暫無外資連續買超資料，請稍後再試</div></div>';
                    return;
                }

                const html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="icon">🔥</span>
                            <span class="card-title">外資連續買超排行 (依連續天數)</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>股票</th>
                                    <th>股價</th>
                                    <th>連買天數</th>
                                    <th>累計買超</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map((s, i) => `
                                    <tr onclick="window.location='/stock/${s.code}'">
                                        <td>${i + 1}</td>
                                        <td>
                                            <span class="stock-code">${s.code}</span>
                                            <span class="stock-name">${s.name}</span>
                                        </td>
                                        <td class="price">${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                        <td><span class="days-badge ${getDaysBadgeClass(s.consecutive_days || 0)}">${s.consecutive_days || 0} 天</span></td>
                                        <td class="positive">+${formatNumber(s.total_net_buy || 0)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗</div>';
            }
        }

        async function loadTrust() {
            try {
                const resp = await fetch(`${API_BASE}/trust-accumulation?limit=30`);
                const data = await resp.json();
                const items = flattenRankings(data);

                if (items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">暫無投信認養資料，請稍後再試</div></div>';
                    return;
                }

                const html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="icon">💎</span>
                            <span class="card-title">投信認養股排行 (依連續買超天數)</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>股票</th>
                                    <th>股價</th>
                                    <th>買超天數</th>
                                    <th>累計買超</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map((s, i) => `
                                    <tr onclick="window.location='/stock/${s.code}'">
                                        <td>${i + 1}</td>
                                        <td>
                                            <span class="stock-code">${s.code}</span>
                                            <span class="stock-name">${s.name}</span>
                                        </td>
                                        <td class="price">${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                        <td><span class="days-badge ${getDaysBadgeClass(s.buy_days || 0)}">${s.buy_days || 0} 天</span></td>
                                        <td class="positive">+${formatNumber(s.total_trust_net || 0)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗</div>';
            }
        }

        async function loadSync() {
            try {
                const resp = await fetch(`${API_BASE}/synchronized-buying?limit=30`);
                const data = await resp.json();
                const items = flattenRankings(data);

                if (items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">暫無三大法人同步買超資料，請稍後再試</div></div>';
                    return;
                }

                const html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="icon">🎯</span>
                            <span class="card-title">三大法人同步買超</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>股票</th>
                                    <th>股價</th>
                                    <th>同步天數</th>
                                    <th>總買超</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map((s, i) => `
                                    <tr onclick="window.location='/stock/${s.code}'">
                                        <td>${i + 1}</td>
                                        <td>
                                            <span class="stock-code">${s.code}</span>
                                            <span class="stock-name">${s.name}</span>
                                        </td>
                                        <td class="price">${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                        <td><span class="days-badge ${getDaysBadgeClass(s.sync_days || 0)}">${s.sync_days || 0} 天</span></td>
                                        <td class="positive">+${formatNumber(s.total_amount || 0)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗</div>';
            }
        }

        async function loadDeviation() {
            try {
                const resp = await fetch(`${API_BASE}/price-deviation?limit=30`);
                const data = await resp.json();
                const items = flattenRankings(data);

                if (items.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">暫無乖離資料，請稍後再試</div></div>';
                    return;
                }

                const positiveItems = items.filter(s => (s.deviation_pct || 0) > 0).slice(0, 15);
                const negativeItems = items.filter(s => (s.deviation_pct || 0) < 0).slice(0, 15);

                const html = `
                    <div class="grid">
                        <div class="card">
                            <div class="card-header">
                                <span class="icon">📈</span>
                                <span class="card-title">正乖離過大 (股價高於成本)</span>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>股票</th>
                                        <th>股價</th>
                                        <th>平均成本</th>
                                        <th>乖離率</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${positiveItems.length ? positiveItems.map(s => `
                                        <tr onclick="window.location='/stock/${s.code}'">
                                            <td>
                                                <span class="stock-code">${s.code}</span>
                                                <span class="stock-name">${s.name}</span>
                                            </td>
                                            <td class="price">${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                            <td class="price">${s.avg_cost ? s.avg_cost.toFixed(1) : '-'}</td>
                                            <td class="positive">+${(s.deviation_pct || 0).toFixed(1)}%</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="4" class="loading">暫無資料</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <span class="icon">📉</span>
                                <span class="card-title">負乖離過大 (股價低於成本)</span>
                            </div>
                            <table>
                                <thead>
                                    <tr>
                                        <th>股票</th>
                                        <th>股價</th>
                                        <th>平均成本</th>
                                        <th>乖離率</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${negativeItems.length ? negativeItems.map(s => `
                                        <tr onclick="window.location='/stock/${s.code}'">
                                            <td>
                                                <span class="stock-code">${s.code}</span>
                                                <span class="stock-name">${s.name}</span>
                                            </td>
                                            <td class="price">${s.current_price ? s.current_price.toFixed(1) : '-'}</td>
                                            <td class="price">${s.avg_cost ? s.avg_cost.toFixed(1) : '-'}</td>
                                            <td class="negative">${(s.deviation_pct || 0).toFixed(1)}%</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="4" class="loading">暫無資料</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading" style="color:#e74c3c">載入失敗</div>';
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('content').innerHTML = '<div class="loading">載入資料中...</div>';
                const tabId = tab.dataset.tab;
                if (tabId === 'today') loadToday();
                else if (tabId === 'consecutive') loadConsecutive();
                else if (tabId === 'trust') loadTrust();
                else if (tabId === 'sync') loadSync();
                else if (tabId === 'deviation') loadDeviation();
            });
        });

        loadToday();
        updateDataTime();
    </script>
</body>
</html>
