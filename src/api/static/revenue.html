    <style>

        .nav-links a:hover, .nav-links a.active {

        }

        .alert-section {
            display: grid;
            grid-template-columns: 1fr 1fr;

        @media (max-width: 900px) {
            .alert-section {

        .card {
            background: rgba(255, 255, 255, 0.05);

            border: 2px solid rgba(230, 126, 34, 0.6);

        .update-period-banner.show { display: flex; }
        .update-period-banner::before { content: '⚠️'; font-size: 1.3rem; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }

<body>
    <div class="container">
        <header>
            <h1>營收追蹤</h1>
            <p class="subtitle">追蹤上市櫃公司月營收表現，找出成長股與衰退股</p>
            <div class="nav-links">
                <a href="/dashboard">📊 策略儀表板</a>
                <a href="/live">📈 今日總結</a>
                <a href="/rankings">🏆 法人排行榜</a>
                <a href="/industry">🏭 產業熱力圖</a>
                <a href="/margin">💰 融資融券</a>
                <a href="/revenue" class="active">📋 營收追蹤</a>
                <a href="/ai">🤖 AI 分析</a>
            </div>
        </header>

        <!-- 資料更新時段提示 -->
        <div id="update-period-banner" class="update-period-banner">
            <span>目前為資料更新時段（21:00-23:00），資料可能正在更新中，請留意資料時間</span>
        </div>

        <div class="alert-section">
            <div class="card">
                <div class="card-title growth">營收爆發股（年增50%+）</div>
                <div id="growth-table">
                    <div class="loading">載入中</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title decline">營收衰退股（年減30%+）</div>
                <div id="decline-table">
                    <div class="loading">載入中</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">營收排行榜</div>
            <div class="date-info" id="ranking-date">-</div>
            <div class="tabs">
                <button class="tab active" data-sort="yoy_change">年增率</button>
                <button class="tab" data-sort="mom_change">月增率</button>
                <button class="tab" data-sort="revenue">營收金額</button>
                <button class="tab" data-sort="cumulative_yoy_change">累計年增率</button>
            </div>
            <div id="rankings-table">
                <div class="loading">載入中</div>
            </div>
        </div>
        <footer style="text-align: center; margin-top: 40px; padding: 20px; color: #666; font-size: 0.85rem;">
            <div>資料來源：台灣證券交易所、櫃買中心 | 每月 10 日前更新</div>
            <div style="margin-top: 10px;">
                <a href="https://github.com/aiinpocket/tw-institutional-stocker" target="_blank" rel="noopener" style="color: #888; text-decoration: none;">
                    <svg height="16" width="16" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 5px; fill: currentColor;"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    開源專案 Open Source
                </a>
            </div>
        </footer>
    </div>

    <script>
        let currentSort = 'yoy_change';

        async function fetchAlerts() {
            try {
                const res = await fetch('/api/v1/revenue/alerts?yoy_min=50&yoy_max=-30');
                const data = await res.json();

                if (data.error) {
                    document.getElementById('growth-table').innerHTML = '<div class="empty-state">暫無營收資料</div>';
                    document.getElementById('decline-table').innerHTML = '<div class="empty-state">暫無營收資料</div>';
                    return;
                }

                // Growth table
                if (data.data.growth && data.data.growth.length > 0) {
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>股票</th>
                                    <th>營收(千)</th>
                                    <th>年增率</th>
                                    <th>月增率</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.data.growth.forEach(item => {
                        html += `
                            <tr>
                                <td>
                                    <a href="/stock/${item.code}" class="stock-link">${item.code}</a>
                                    <span style="color:#888;margin-left:5px;">${item.name}</span>
                                </td>
                                <td>${item.revenue ? item.revenue.toLocaleString() : '-'}</td>
                                <td class="positive">${item.yoy_change ? '+' + item.yoy_change.toFixed(1) + '%' : '-'}</td>
                                <td class="${item.mom_change >= 0 ? 'positive' : 'negative'}">${item.mom_change ? (item.mom_change >= 0 ? '+' : '') + item.mom_change.toFixed(1) + '%' : '-'}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    document.getElementById('growth-table').innerHTML = html;
                } else {
                    document.getElementById('growth-table').innerHTML = '<div class="empty-state">目前無年增50%以上的股票</div>';
                }

                // Decline table
                if (data.data.decline && data.data.decline.length > 0) {
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>股票</th>
                                    <th>營收(千)</th>
                                    <th>年增率</th>
                                    <th>月增率</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.data.decline.forEach(item => {
                        html += `
                            <tr>
                                <td>
                                    <a href="/stock/${item.code}" class="stock-link">${item.code}</a>
                                    <span style="color:#888;margin-left:5px;">${item.name}</span>
                                </td>
                                <td>${item.revenue ? item.revenue.toLocaleString() : '-'}</td>
                                <td class="negative">${item.yoy_change ? item.yoy_change.toFixed(1) + '%' : '-'}</td>
                                <td class="${item.mom_change >= 0 ? 'positive' : 'negative'}">${item.mom_change ? (item.mom_change >= 0 ? '+' : '') + item.mom_change.toFixed(1) + '%' : '-'}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    document.getElementById('decline-table').innerHTML = html;
                } else {
                    document.getElementById('decline-table').innerHTML = '<div class="empty-state">目前無年減30%以上的股票</div>';
                }
            } catch (error) {
                console.error('Failed to fetch alerts:', error);
                document.getElementById('growth-table').innerHTML = '<div class="empty-state">載入失敗</div>';
                document.getElementById('decline-table').innerHTML = '<div class="empty-state">載入失敗</div>';
            }
        }

        async function fetchRankings(sortBy) {
            try {
                const res = await fetch(`/api/v1/revenue/rankings?sort_by=${sortBy}&limit=50`);
                const data = await res.json();

                document.getElementById('ranking-date').textContent = data.year && data.month ?
                    `資料期間：${data.year}年${data.month}月` : '-';

                if (data.error || !data.data || data.data.length === 0) {
                    document.getElementById('rankings-table').innerHTML = '<div class="empty-state">暫無資料</div>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>股票</th>
                                <th>股價</th>
                                <th>營收(千)</th>
                                <th>月增率</th>
                                <th>年增率</th>
                                <th>累計營收</th>
                                <th>累計年增</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.data.forEach(item => {
                    html += `
                        <tr>
                            <td>
                                <a href="/stock/${item.code}" class="stock-link">${item.code}</a>
                                <span style="color:#888;margin-left:5px;">${item.name}</span>
                            </td>
                            <td>${item.close_price ? item.close_price.toFixed(2) : '-'}</td>
                            <td>${item.revenue ? item.revenue.toLocaleString() : '-'}</td>
                            <td class="${item.mom_change >= 0 ? 'positive' : 'negative'}">${item.mom_change !== null ? (item.mom_change >= 0 ? '+' : '') + item.mom_change.toFixed(1) + '%' : '-'}</td>
                            <td class="${item.yoy_change >= 0 ? 'positive' : 'negative'}">${item.yoy_change !== null ? (item.yoy_change >= 0 ? '+' : '') + item.yoy_change.toFixed(1) + '%' : '-'}</td>
                            <td>${item.cumulative_revenue ? item.cumulative_revenue.toLocaleString() : '-'}</td>
                            <td class="${item.cumulative_yoy_change >= 0 ? 'positive' : 'negative'}">${item.cumulative_yoy_change !== null ? (item.cumulative_yoy_change >= 0 ? '+' : '') + item.cumulative_yoy_change.toFixed(1) + '%' : '-'}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                document.getElementById('rankings-table').innerHTML = html;
            } catch (error) {
                console.error('Failed to fetch rankings:', error);
                document.getElementById('rankings-table').innerHTML = '<div class="empty-state">載入失敗</div>';
            }
        }

        // Tab click handlers
        document.querySelectorAll('.tabs .tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentSort = tab.dataset.sort;
                document.getElementById('rankings-table').innerHTML = '<div class="loading">載入中</div>';
                fetchRankings(currentSort);
            });
        });

        // 檢查是否在資料更新時段（台北時間 21:00-23:00）
        function checkUpdatePeriod() {
            const banner = document.getElementById('update-period-banner');
            const now = new Date();
            const taipeiHour = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' })).getHours();
            if (taipeiHour >= 21 && taipeiHour < 23) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        // Initialize
        checkUpdatePeriod();
        fetchAlerts();
        fetchRankings(currentSort);
    </script>
</body>
</html>
